version: "3.9"

services:
  backend1:
    build: ./backend
    container_name: threads_backend_1
    env_file: ./backend/.env.docker
    depends_on:
      - postgres
      - redis

  backend2:
    build: ./backend
    container_name: threads_backend_2
    env_file: ./backend/.env.docker
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: threads_nginx_lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2