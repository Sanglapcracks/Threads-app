apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: threads
data:
  NODE_ENV: production
  PORT: '5000'
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_NAME: realtime_chat_and_threads_app
  DB_USER: postgres
  DB_SSL: 'false'
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  CORS_ORIGINS: http://localhost:4000