apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: threads
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: threads-backend:local
          imagePullPolicy: IfNotPresent
          command: ['node', 'dist/db/migrate.js']
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets