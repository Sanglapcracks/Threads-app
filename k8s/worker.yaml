apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: threads
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: threads-backend:local
          imagePullPolicy: IfNotPresent
          command: ['node', 'dist/workers/run-notification-worker.js']
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi